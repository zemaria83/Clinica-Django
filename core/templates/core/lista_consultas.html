{% extends "core/base.html" %}
{% block content %}
<h1>Agenda de Consultas</h1>
<table>
    <tr><th>Data</th><th>Paciente</th><th>Motivo</th><th>Estado</th></tr>
    {% for c in consultas %}
    <tr>
        <td>{{ c.data|date:"d/m/Y H:i" }}</td>
        <td><a href="{% url 'detalhe_paciente' c.paciente.pk %}">{{ c.paciente.nome }}</a></td>
        <td>{{ c.motivo }}</td>
        <td><span class="badge {{ c.estado }}">{{ c.get_estado_display }}</span></td>
    </tr>
    {% empty %}
    <tr><td colspan="4">Nenhuma consulta registada.</td></tr>
    {% endfor %}
</table>
{% endblock %}
